<style>
/* Layout: booking-site style. White app bar, city tabs as pills, a route sketch per city,
   then numbered stops with the drive between each pair. Light theme only, by choice. */
:root {
  --bg: #EEF2F8; --surface: #FFFFFF; --ink: #101B33; --muted: #59647A; --line: #DDE3EE;
  --primary: #1A5FD6; --primary-ink: #FFFFFF; --primary-soft: #E7EFFC; --primary-line: #8FB1EC;
  --sun: #FFD24C; --sun-soft: #FFF3CC; --sun-ink: #4D3900;
  --good: #137A47; --good-soft: #E2F5EA; --owe: #B23A20; --owe-soft: #FCE9E4;
  --map: #F4F8FD; --map-grid: #E2EAF6;
  --display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body);
  padding-block: 0 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
#app { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance }
input, select, textarea, button { font: inherit; color: inherit }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-width: 0; max-width: 100% }
textarea { width: 100%; resize: vertical; font-size: 13px; word-break: break-all }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px }
button, .btn { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; color: var(--ink) }
button:disabled { opacity: .35; cursor: default }
.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary) }
.link { border: 0; background: none; padding: 4px 6px; color: var(--primary); font-size: 13px; font-weight: 600 }
.link.danger { color: var(--owe) }
.sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.grow { flex: 1 1 180px; min-width: 0 }
.err { color: var(--owe); font-size: 13px }
.note { background: var(--sun-soft); color: var(--sun-ink); border-radius: 10px; padding: 9px 12px; font-size: 13px }

.appbar { background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 18px 18px; padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center }
.brand { margin-right: auto; min-width: 0 }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--primary) }
.brand h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em }
.travelers { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px }
.av { font-size: 12px; font-weight: 600; background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 2px 9px }
.by { font-size: 12px; color: var(--muted) }
.gate { padding: 24px; gap: 14px }
.gatehead { font-size: 22px; font-weight: 800; letter-spacing: -0.01em }
.big { padding: 12px 18px; font-size: 16px; gap: 10px }
.big svg { background: #fff; border-radius: 50%; padding: 2px; box-sizing: content-box }
.whoami { font-size: 13px; font-weight: 600; color: var(--muted) }
.adminpill { font-size: 12px; font-weight: 700; background: var(--sun); color: var(--sun-ink); border-radius: 999px; padding: 4px 10px }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px }
.tab { flex: none; border-radius: 999px; padding: 8px 14px }
.tab .count { font-size: 12px; font-weight: 600; background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums }
.tab[aria-selected="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink) }
.tab[aria-selected="true"] .count { background: var(--surface); color: var(--primary) }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px }
.cityhead h2 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em }
.between { justify-content: space-between }
.stayline { align-self: flex-start; background: var(--sun-soft); color: var(--sun-ink); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 500 }
.sketch svg { width: 100%; height: auto; display: block; border-radius: 12px; background: var(--map); border: 1px solid var(--line) }
.sketch .pin { cursor: pointer }
.farlist { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px }
.farchip { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--surface) }
.farchip b { color: var(--sun-ink); background: var(--sun); border-radius: 999px; padding: 0 6px; font-size: 11px }
.farchip.on { border-color: var(--primary); color: var(--primary) }
.nomap { background: var(--map); border: 1px dashed var(--line); border-radius: 12px; padding: 24px; text-align: center; color: var(--muted); font-size: 14px }
.gmap { width: 100%; height: 260px; border: 1px solid var(--line); border-radius: 12px; display: block }
.total { font-size: 14px; font-weight: 600 }

.stops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.stop { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0 }
.stop.sel { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft) }
.stop.dragging { border-color: var(--primary); box-shadow: 0 12px 28px rgba(16, 27, 51, .18); position: relative; z-index: 2 }
.stops.reordering { gap: 8px }
.stops.reordering .leg { display: none }
.grip { touch-action: none; cursor: grab; border: 0; background: none; padding: 6px 2px; color: var(--muted); flex: none }
.grip:active { cursor: grabbing }
.num { flex: none; width: 30px; height: 30px; border-radius: 15px; background: var(--sun); color: var(--sun-ink); font: 800 14px/30px var(--display); text-align: center; font-variant-numeric: tabular-nums }
.stop .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px }
.stop .title { border: 0; background: none; padding: 0; font-weight: 700; font-size: 16px; text-align: left; color: var(--ink); overflow-wrap: anywhere }
.when { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px }
.when input { padding: 5px 8px; font-size: 13px }
.loc { font-size: 13px; color: var(--owe) }
.loc.finding { color: var(--muted) }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none }
.chipbtn { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); border-color: transparent }
.updown { display: flex; gap: 4px }
.updown button { padding: 2px 8px; font-size: 13px }
.leg { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 4px 0 4px 54px; font-size: 13px; color: var(--muted); min-height: 40px }
.leg .line { width: 0; align-self: stretch; min-height: 32px; border-left: 2px dashed var(--primary-line); margin-left: -36px; margin-right: 22px }
.leg b { color: var(--ink); font-variant-numeric: tabular-nums }
.est { font-size: 11px; background: var(--bg); border-radius: 999px; padding: 1px 7px }
.warn { flex-basis: 100%; color: var(--sun-ink); background: var(--sun-soft); border-radius: 8px; padding: 4px 8px }
.locform { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px }

.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); flex: 1 1 150px; min-width: 0 }
.field input, .field select { font-size: 15px; color: var(--ink); width: 100% }
.card > .field { flex: none }
.search { position: relative }
.flabel { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px }
.searchbox { position: relative }
.searchbox svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none }
.searchbox input { width: 100%; padding: 12px 14px 12px 40px; font-size: 16px; border-radius: 999px }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; list-style: none; margin: 0; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 30px rgba(16, 27, 51, .16); max-height: 320px; overflow-y: auto }
.suggest button { width: 100%; border: 0; background: none; border-radius: 10px; padding: 9px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 0; text-align: left; font-weight: 400 }
.suggest button b { font-weight: 600 }
.suggest button span { font-size: 12px; color: var(--muted) }
.suggest li[aria-selected="true"] button, .suggest button:hover { background: var(--primary-soft) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--ink); background: var(--bg) }
.chip input { margin: 0; padding: 0 }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 18px; background: var(--surface) }
.stat { padding: 14px; min-width: 0 }
.stat + .stat { border-left: 1px solid var(--line) }
.stat .lbl { font-size: 12px; color: var(--muted) }
.stat .val { font: 700 22px var(--display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.list li { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line) }
.list li:first-child { border-top: 0 }
.list .main { flex: 1 1 180px; min-width: 0 }
.list .ttl { font-weight: 600; overflow-wrap: anywhere }
.amt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap }
.pill.pos { background: var(--good-soft); color: var(--good) } .pill.neg { background: var(--owe-soft); color: var(--owe) } .pill.zero { background: var(--bg); color: var(--muted) }
.empty { color: var(--muted); font-size: 14px; margin: 0 }
.version { max-width: 820px; margin: 28px auto 0; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
@media (max-width: 520px) {
  .stat .val { font-size: 17px } .stat { padding: 10px }
  .cityhead h2 { font-size: 22px }
  .stop { flex-wrap: wrap }
  .side { flex-direction: row; flex-wrap: wrap; align-items: center; width: 100%; padding-left: 74px }
}
</style>

<script id="core">
/* Pure logic: money in integer cents, distances, link parsing, share codes. */
var Core = (function () {
  function toMinor(text) {
    var clean = String(text).replace(/[^0-9.,-]/g, '').replace(/,/g, '');
    if (clean === '' || isNaN(Number(clean))) return null;
    return Math.round(Number(clean) * 100);
  }
  function fmt(minor) {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(minor / 100);
  }
  /* Equal split; leftover cents go one each to the first people so shares always add up. */
  function shares(total, ids) {
    var n = ids.length, base = Math.floor(total / n), extra = total - base * n, out = {};
    ids.forEach(function (id, i) { out[id] = base + (i < extra ? 1 : 0); });
    return out;
  }
  /* Positive balance = should get money back. Negative = owes. */
  function balances(trip) {
    var b = {};
    trip.people.forEach(function (p) { b[p.id] = 0; });
    trip.expenses.forEach(function (e) {
      if (!e.split.length) return;
      b[e.paidBy] = (b[e.paidBy] || 0) + e.amount;
      var s = shares(e.amount, e.split);
      Object.keys(s).forEach(function (id) { b[id] = (b[id] || 0) - s[id]; });
    });
    (trip.payments || []).forEach(function (p) {
      b[p.from] = (b[p.from] || 0) + p.amount;
      b[p.to] = (b[p.to] || 0) - p.amount;
    });
    return b;
  }
  /* Biggest debtor pays biggest creditor until everyone is at zero. */
  function settle(bal) {
    var debt = [], cred = [], out = [];
    Object.keys(bal).forEach(function (id) {
      if (bal[id] < 0) debt.push({ id: id, v: -bal[id] });
      else if (bal[id] > 0) cred.push({ id: id, v: bal[id] });
    });
    var byV = function (a, b) { return b.v - a.v || (a.id < b.id ? -1 : 1); };
    while (debt.length && cred.length) {
      debt.sort(byV); cred.sort(byV);
      var pay = Math.min(debt[0].v, cred[0].v);
      out.push({ from: debt[0].id, to: cred[0].id, amount: pay });
      debt[0].v -= pay; cred[0].v -= pay;
      if (!debt[0].v) debt.shift();
      if (!cred[0].v) cred.shift();
    }
    return out;
  }
  function totals(trip) {
    var spent = 0, paid = {}, share = {};
    trip.people.forEach(function (p) { paid[p.id] = 0; share[p.id] = 0; });
    trip.expenses.forEach(function (e) {
      spent += e.amount;
      paid[e.paidBy] = (paid[e.paidBy] || 0) + e.amount;
      var s = shares(e.amount, e.split);
      Object.keys(s).forEach(function (id) { share[id] = (share[id] || 0) + s[id]; });
    });
    return { spent: spent, paid: paid, share: share };
  }
  function encode(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj)), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decode(code) {
    var b64 = String(code).trim().replace(/^.*#t-/, '').replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  /* Straight-line miles between two points. */
  function miles(a, b) {
    var R = 3958.8, r = Math.PI / 180;
    var dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  /* Pulls coordinates out of a Google Maps link, or "lat, lng" text. */
  function parseLatLng(s) {
    s = String(s || '').trim();
    var m = /!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/.exec(s)
      || /[?&](?:q|query|ll|destination)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i.exec(s)
      || /@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/.exec(s)
      || /^(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/.exec(s);
    if (!m) return null;
    var lat = +m[1], lng = +m[2];
    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return { lat: lat, lng: lng };
  }
  return { toMinor: toMinor, fmt: fmt, shares: shares, balances: balances, settle: settle, totals: totals, encode: encode, decode: decode, miles: miles, parseLatLng: parseLatLng };
})();
if (typeof module !== 'undefined') module.exports = Core;
</script>

    h += '<div class="card"><h3>Settle up</h3>' + (plan.length ? '<p class="sub" style="margin:0">The fewest payments that bring everyone to zero.</p>' : '') + list(plan.map(function (x) {
      return '<li><div class="main"><div class="ttl">' + esc(person(x.from)) + ' pays ' + esc(person(x.to)) + '</div></div><div class="amt">' + fmt(x.amount) + '</div>' +
        '<button data-act="pay" data-from="' + x.from + '" data-to="' + x.to + '" data-amount="' + x.amount + '">Mark as paid</button></li>';
    }), data.expenses.length ? 'Everyone is settled.' : 'Log some expenses and the payments show here.') + '</div>';
    if (data.payments.length) h += '<div class="card"><h3>Payments made</h3>' + list(data.payments.map(function (p) {
      return '<li><div class="main"><div class="ttl">' + esc(person(p.from)) + ' paid ' + esc(person(p.to)) + '</div><div class="sub">' + niceDate(p.date) + '</div></div><div class="amt">' + fmt(p.amount) + '</div>' +
        (ui.admin ? '<button class="link" data-act="undo-pay" data-id="' + p.id + '">Undo</button>' : '') + '</li>';
    }), '') + '</div>';
    return h;
  }

  function logLine(l) {
    var when = '';
    try { when = new Date(l.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (e) {}
    return '<li><div class="main"><div><b>' + esc(l.who ? person(l.who) : 'Someone') + '</b> ' + esc(l.act) + ' ' + esc(l.text) + '</div><div class="sub">' + esc(when) + '</div></div></li>';
  }
  function gateHTML() {
    var st = CLOUD.state;
    if (st === 'signedout') {
      return '<section class="card gate"><h2 class="gatehead">Sign in to open the trip</h2>' +
        '<p class="sub" style="margin:0">Use your Google account. You only do this once; this browser remembers you after that, and the trip is the same on every phone and laptop you sign in on.</p>' +
        '<div><button class="primary big" data-act="sign-in">' + GLOGO + 'Sign in with Google</button></div></section>';
    }
    if (st === 'pickme') {
      var taken = {};
      Object.keys(CLOUD.members).forEach(function (k) { if (k !== CLOUD.user.uid) taken[CLOUD.members[k].person] = CLOUD.members[k].name || 'someone'; });
      return '<section class="card gate"><h2 class="gatehead">Which traveler are you?</h2>' +
        '<p class="sub" style="margin:0">Signed in as ' + esc(CLOUD.user.displayName || CLOUD.user.email || 'you') + '. Pick your name once so the trip shows who added what.</p>' +
        '<div class="chips">' + PEOPLE.map(function (p) {
          return taken[p.id] ? '<button class="btn chipbtn" disabled title="Picked by ' + esc(taken[p.id]) + '">' + esc(p.name) + ' (taken)</button>'
            : '<button class="btn chipbtn" data-act="be" data-id="' + p.id + '">' + esc(p.name) + '</button>';
        }).join('') + '</div><p class="sub" style="margin:0">Someone picked your name by mistake? Ask Pranay to reset it.</p>' +
        '<div><button class="link" data-act="sign-out">Use a different Google account</button></div></section>';
    }
    if (st === 'error') return '<section class="card gate"><h2 class="gatehead">Something went wrong</h2><p class="sub" style="margin:0">' + esc(CLOUD.err) + '</p><div><button class="primary" data-act="retry">Try again</button></div></section>';
    return '<section class="card gate"><p class="sub" style="margin:0">Loading the trip…</p></section>';
  }
  function render() {
    pendingRender = false;
    var h = '<header class="appbar"><div class="brand"><div class="eyebrow">Group trip · Dec 24 to 31</div><h1>San Diego, LA and Las Vegas</h1>' +
      '<div class="travelers">' + PEOPLE.map(function (p) { return '<span class="av">' + esc(p.name) + '</span>'; }).join('') + '</div></div>' +
      (CLOUD.on
        ? '<div class="row">' + (CLOUD.state === 'ready' ? (ui.admin ? '<span class="adminpill">Admin</span>' : '') +
            '<button data-act="invite">Invite</button><button data-act="toggle-log" aria-pressed="' + ui.showLog + '">Activity</button>' : '') +
          (CLOUD.user ? '<span class="whoami">' + esc(me ? person(me) : (CLOUD.user.displayName || '')) + '</span><button class="link" data-act="sign-out">Sign out</button>' : '') + '</div></header>'
        : '<div class="row"><button data-act="toggle-share">Share</button>' +
          (ui.admin ? '<span class="adminpill">Admin</span><button class="link" data-act="lock">Lock</button>' : '<button data-act="admin-open">Admin</button>') + '</div></header>');
    if (CLOUD.on && CLOUD.state !== 'ready') {
      if (ui.msg) h += '<div class="note" role="status">' + esc(ui.msg) + '</div>';
      app.innerHTML = h + gateHTML();
      return;
    }
    if (CLOUD.on && allLoaded()) {
      if (!data.places.length && !data.expenses.length) {
        h += ui.admin
          ? '<section class="card"><h3>Start the shared trip</h3><p class="sub" style="margin:0">The shared trip is empty. Start it with the stops and expenses saved in this browser (' + (localData.places || []).length + ' stops, ' + (localData.expenses || []).length + ' expenses). Everyone who signs in then sees the same trip.</p><div><button class="primary" data-act="start-trip">Start the shared trip</button></div></section>'
          : '<section class="card"><h3>Almost there</h3><p class="sub" style="margin:0">Pranay has not started the shared trip yet. It appears here as soon as he does.</p></section>';
      } else {
        var ex = localExtras(), nEx = ex.places.length + ex.expenses.length + ex.payments.length, done = false;
        try { done = localStorage.getItem('tripwallet.extrasDone') === '1'; } catch (e) {}
        if (nEx && !done) {
          var parts = [];
          if (ex.places.length) parts.push(ex.places.length + (ex.places.length === 1 ? ' stop' : ' stops'));
          if (ex.expenses.length) parts.push(ex.expenses.length + (ex.expenses.length === 1 ? ' expense' : ' expenses'));
          if (ex.payments.length) parts.push(ex.payments.length + (ex.payments.length === 1 ? ' payment' : ' payments'));
          h += '<section class="card"><h3>Saved in this browser</h3><p class="sub" style="margin:0">This browser has ' + parts.join(', ') + ' from before sign-in that the shared trip does not have. Add them so everyone sees them?</p>' +
            '<div class="row"><button class="primary" data-act="add-extras">Add to the shared trip</button><button class="link" data-act="skip-extras">Not now</button></div></section>';
        }
      }
    }
    if (CLOUD.on && ui.showLog) {
      var log = data.log.slice().reverse().slice(0, 60);
      h += '<section class="card"><div class="row between"><h3>Activity</h3><button class="link" data-act="toggle-log">Close</button></div>' +
        (log.length ? '<ul class="list">' + log.map(logLine).join('') + '</ul>' : '<p class="empty">Nothing yet. Adding and removing stops and expenses shows up here with who did it.</p>');
      if (ui.admin) {
        h += '<h3>Signed-in travelers</h3><ul class="list">' + Object.keys(CLOUD.members).map(function (k) {
          var m = CLOUD.members[k];
          return '<li><div class="main"><div class="ttl">' + esc(person(m.person)) + '</div><div class="sub">Google name: ' + esc(m.name || 'unknown') + '</div></div>' +
            (k === CLOUD.user.uid ? '' : '<button class="link danger" data-act="reset-member" data-id="' + k + '">Reset</button>') + '</li>';
        }).join('') + '</ul><p class="sub" style="margin:0">Reset frees a name picked by the wrong person. They pick again next time they open the page.</p>';
      }
      h += '</section>';
    }

    if (!CLOUD.on && ui.adminOpen && !ui.admin) {
      h += '<form class="card" id="admin-form"><h3>Admin sign-in</h3><p class="sub" style="margin:0">Only the admin can remove or edit stops and expenses. Everyone can add.</p>' +
        '<div class="row"><input id="admin-pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="Admin PIN" style="width:140px">' +
        '<button class="primary" type="submit">Unlock</button><button type="button" class="link" data-act="admin-close">Cancel</button></div><div class="err" data-err hidden></div></form>';
    }
    if (ui.msg) h += '<div class="note" role="status">' + esc(ui.msg) + '</div>';
    if (ui.share) {
      var code = Core.encode(exportData()), sa = standalone();
      h += '<section class="card"><h3>Share and merge</h3>' +
        '<p class="sub" style="margin:0">What you add is saved in this browser. Send your ' + (sa ? 'link' : 'code') + ' to Pranay, who merges everyone\'s additions and sends the group a fresh one.</p>' +
        (sa ? '<div class="row"><input id="share-link" class="grow" readonly value="' + esc(location.origin + location.pathname + '#t-' + code) + '"><button data-act="copy" data-target="share-link">Copy link</button></div>' : '') +
        '<label class="field">Your trip code<textarea id="share-code" rows="3" readonly>' + code + '</textarea></label>' +
        '<div class="row"><button data-act="copy" data-target="share-code">Copy code</button></div>' +
        '<label class="field">Merge a code from someone else<textarea id="import-code" rows="2" placeholder="Paste a trip code">' + esc(ui.importText) + '</textarea></label>' +
        '<div class="err" id="import-err" hidden></div>' +
        '<div class="row"><button class="primary" data-act="import">Merge</button><button class="link" data-act="toggle-share">Close</button></div></section>';
    }

    var spent = data.expenses.reduce(function (a, e) { return a + e.amount; }, 0);
    h += '<div class="tabs" role="tablist">' + CITIES.map(function (c) {
      return '<button class="tab" role="tab" data-act="tab" data-id="' + c.id + '" aria-selected="' + (ui.tab === c.id) + '">' + esc(c.name) + ' <span class="count">' + cityPlaces(c.id).length + '</span></button>';
    }).join('') + '<button class="tab" role="tab" data-act="tab" data-id="costs" aria-selected="' + (ui.tab === 'costs') + '">Expenses <span class="count">' + fmt(spent) + '</span></button></div>';

    var c = cityById(ui.tab);
    h += c ? cityTab(c) : costsTab();
    app.innerHTML = h;
    if (c) fetchLegs(cityPlaces(c.id));
    geocodeMissing();
  }

  /* ---------- Actions ---------- */
  function reorderCity(cid, ids) {
    var byId = {};
    data.places.forEach(function (p) { byId[p.id] = p; });
    var moved = ids.map(function (id) { return byId[id]; }).filter(Boolean);
    data.places = data.places.filter(function (p) { return p.city !== cid; }).concat(moved);
    save();
  }
  var ADMIN_ONLY = ['edit-place', 'delete-place', 'edit-expense', 'delete-expense', 'undo-pay', 'ask', 'reset-member', 'start-trip'];
  function act(a, d) {
    if (ADMIN_ONLY.indexOf(a) >= 0 && !ui.admin) return;
    if (a !== 'ask') ui.confirm = null;
    if (a !== 'import') ui.msg = '';
    if (a === 'tab') {
      ui.tab = d.id; ui.adding = false; ui.editing = null; ui.editingExp = null; ui.locFor = null; ui.sel = null;
      try { localStorage.setItem(TAB_KEY, d.id); } catch (e) {}
    }
    else if (a === 'select') ui.sel = ui.sel === d.id ? null : d.id;
    else if (a === 'move') {
      var ids = cityPlaces(ui.tab).map(function (p) { return p.id; }), i = ids.indexOf(d.id), j = i + (+d.dir);
      if (i >= 0 && j >= 0 && j < ids.length) { ids.splice(j, 0, ids.splice(i, 1)[0]); reorderCity(ui.tab, ids); }
    }
    else if (a === 'set-loc') ui.locFor = d.id;
    else if (a === 'cancel-loc') ui.locFor = null;
    else if (a === 'ask') ui.confirm = d.id;
    else if (a === 'cancel') ui.confirm = null;
    else if (a === 'add-stop') { ui.adding = !(ui.adding || ui.editing); ui.editing = null; results = []; active = -1; searchSeq++; }
    else if (a === 'edit-place') { ui.editing = d.id; ui.adding = false; }
    else if (a === 'cancel-edit') { ui.adding = false; ui.editing = null; ui.editingExp = null; results = []; active = -1; searchSeq++; }
    else if (a === 'delete-place') {
      var gp = placeById(d.id);
      if (gp) logIt('removed', gp.name + ' in ' + cityName(gp.city));
      data.places = data.places.filter(function (p) { return p.id !== d.id; });
      data.deleted.push(d.id);
      if (ui.editing === d.id) ui.editing = null;
      if (ui.sel === d.id) ui.sel = null;
      save();
    }
    else if (a === 'edit-expense') ui.editingExp = d.id;
    else if (a === 'delete-expense') {
      var ge = data.expenses.find(function (e) { return e.id === d.id; });
      if (ge) logIt('removed', 'the expense ' + ge.desc + ' (' + fmt(ge.amount) + ')');
      data.expenses = data.expenses.filter(function (e) { return e.id !== d.id; }); data.deleted.push(d.id); if (ui.editingExp === d.id) ui.editingExp = null; save(); }
    else if (a === 'pay') {
      data.payments.push(stamp({ id: uid(), from: d.from, to: d.to, amount: +d.amount, date: today() }));
      logIt('recorded', 'a payment: ' + person(d.from) + ' paid ' + person(d.to) + ' ' + fmt(+d.amount));
      save();
    }
    else if (a === 'undo-pay') {
      var gq = data.payments.find(function (q) { return q.id === d.id; });
      if (gq) logIt('undid', 'a payment: ' + person(gq.from) + ' paid ' + person(gq.to) + ' ' + fmt(gq.amount));
      data.payments = data.payments.filter(function (p) { return p.id !== d.id; }); data.deleted.push(d.id); save(); }
    else if (a === 'toggle-share') ui.share = !ui.share;
    else if (a === 'admin-open') ui.adminOpen = true;
    else if (a === 'admin-close') ui.adminOpen = false;
    else if (a === 'sign-in') { signIn(); return; }
    else if (a === 'sign-out') { CLOUD.au.signOut(CLOUD.auth); return; }
    else if (a === 'retry') { location.reload(); return; }
    else if (a === 'be') {
      CLOUD.fs.setDoc(CLOUD.fs.doc(CLOUD.db, 'trips', 'main', 'members', CLOUD.user.uid), { person: d.id, name: String(CLOUD.user.displayName || '').slice(0, 60), at: new Date().toISOString() })
        .catch(function (err) { ui.msg = 'Could not save your name (' + (err.code || err.message) + ').'; render(); });
      return;
    }
    else if (a === 'reset-member') { CLOUD.fs.deleteDoc(CLOUD.fs.doc(CLOUD.db, 'trips', 'main', 'members', d.id)).catch(function () {}); return; }
    else if (a === 'toggle-log') ui.showLog = !ui.showLog;
    else if (a === 'invite') {
      var link = location.origin + location.pathname;
      ui.msg = 'Invite link: ' + link + '. Friends open it and sign in with Google.';
      try { navigator.clipboard.writeText(link).then(function () { ui.msg = 'Link copied. Friends open it and sign in with Google once.'; render(); }, function () {}); } catch (e) {}
    }
    else if (a === 'start-trip') {
      if (!ui.admin || data.places.length) return;
      ['places', 'expenses', 'payments'].forEach(function (col) { data[col] = JSON.parse(JSON.stringify(localData[col] || [])); });
      logIt('started', 'the shared trip');
      save();
    }
    else if (a === 'add-extras') {
      var ex = localExtras();
      data.places = data.places.concat(ex.places);
      data.expenses = data.expenses.concat(ex.expenses);
      data.payments = data.payments.concat(ex.payments);
      logIt('added', 'items saved in their browser before sign-in (' + (ex.places.length + ex.expenses.length + ex.payments.length) + ')');
      try { localStorage.setItem('tripwallet.extrasDone', '1'); } catch (e) {}
      save();
    }
    else if (a === 'skip-extras') { try { localStorage.setItem('tripwallet.extrasDone', '1'); } catch (e) {} }
    else if (a === 'lock') { ui.admin = false; ui.editing = null; ui.editingExp = null; try { sessionStorage.removeItem(ADMIN_KEY); } catch (e) {} }
    else if (a === 'import') {
      var box = document.getElementById('import-code');
      ui.importText = box ? box.value : '';
      try { ui.msg = mergedMsg(merge(Core.decode(ui.importText))); ui.share = false; ui.importText = ''; }
      catch (e) {
        var err = document.getElementById('import-err');
        if (err) { err.textContent = 'That code could not be read. Copy the whole code and try again.'; err.hidden = false; }
        return;
      }
    }
    render();
    if (a === 'add-stop' && ui.adding) { var nm = document.getElementById('place-name'); if (nm) nm.focus(); }
    if (a === 'edit-place' || a === 'edit-expense') {
      var f = document.getElementById(a === 'edit-place' ? 'place-form' : 'expense-form');
      if (f && f.scrollIntoView) f.scrollIntoView({ block: 'start' });
    }
  }

  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b || !app.contains(b)) return;
    var a = b.getAttribute('data-act');
    if (a === 'pick') { pick(+b.dataset.i); return; }
    if (a === 'copy') {
      var el = document.getElementById(b.getAttribute('data-target')), label = b.textContent;
      var done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = label; }, 1500); };
      var fallback = function () { el.focus(); el.select(); b.textContent = 'Selected. Press copy'; };
      try { navigator.clipboard.writeText(el.value).then(done, fallback); } catch (e) { fallback(); }
      return;
    }
    act(a, b.dataset);
  });

  app.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.dataset && el.dataset.place) {
      var p = placeById(el.dataset.place);
      if (p) { p[el.dataset.field] = el.value; save(); refreshLegs(); }
    }
  });

  function sha(s) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode('tripwallet:' + s)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    });
  }

  app.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var form = ev.target, val = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; };
    var fail = function (msg) { var slot = form.querySelector('[data-err]'); if (slot) { slot.textContent = msg; slot.hidden = false; } };

    if (form.id === 'admin-form') {
      var pin = val('admin-pin');
      if (!pin) return fail('Enter the PIN.');
      if (!window.crypto || !crypto.subtle) return fail('This browser cannot check the PIN here. Open the page over https.');
      sha(pin).then(function (h) {
        if (h !== ADMIN_HASH) return fail('That PIN is not right.');
        ui.admin = true; ui.adminOpen = false;
        try { sessionStorage.setItem(ADMIN_KEY, '1'); } catch (e) {}
        render();
      }, function () { fail('This browser cannot check the PIN here.'); });
      return;
    }

    if (form.classList.contains('locform')) {
      var target = placeById(form.dataset.id), ll = Core.parseLatLng(val('loc-' + form.dataset.id));
      if (!ll) return fail('No location found in that. Use the full link from the address bar (short share links do not include it), or type latitude, longitude.');
      if (target) { target.lat = ll.lat; target.lng = ll.lng; target.pin = true; delete target.geo; save(); }
      ui.locFor = null; render(); return;
    }

    if (form.id === 'place-form') {
      var name = val('place-name'), link = val('place-link'), pll = link ? Core.parseLatLng(link) : null;
      if (!name) return fail('Type the name of the place.');
      if (link && !pll) return fail('That link has no location in it. Use the full link from the address bar (short share links do not include it), or type latitude, longitude.');
      var clash = cityPlaces(ui.tab).some(function (p) { return p.id !== ui.editing && p.name.toLowerCase() === name.toLowerCase(); });
      if (clash) return fail(name + ' is already on the list.');
      var rec = { name: name, note: val('place-note'), date: val('place-date'), time: val('place-time') };
      var old = ui.editing && ui.admin ? placeById(ui.editing) : null;
      if (old) {
        if (pll) { old.lat = pll.lat; old.lng = pll.lng; old.pin = true; delete old.geo; }
        else if (old.name !== name && !old.pin) { old.lat = null; old.lng = null; old.q = ''; delete old.geo; delete geoTried[old.id]; }
        Object.assign(old, rec);
        logIt('edited', old.name + ' in ' + cityName(old.city));
        ui.editing = null;
      } else {
        var np = Object.assign({ id: 'u-' + uid(), city: ui.tab, lat: pll ? pll.lat : null, lng: pll ? pll.lng : null, q: '', pin: !!pll }, rec);
        stamp(np);
        data.places.push(np);
        logIt('added', np.name + ' in ' + cityName(ui.tab));
        ui.sel = np.id;
        ui.adding = false;
      }
      save(); render(); return;
    }

    if (form.id === 'expense-form') {
      var desc = val('exp-desc'), amount = Core.toMinor(val('exp-amount'));
      var split = Array.prototype.map.call(document.querySelectorAll('input[name="exp-split"]:checked'), function (c) { return c.value; });
      if (!desc) return fail('Say what the expense was.');
      if (amount === null || amount <= 0) return fail('Enter an amount above zero.');
      if (!split.length) return fail('Pick at least one person to split it between.');
      var e = { desc: desc, amount: amount, paidBy: val('exp-payer'), split: split, date: val('exp-date') || today() };
      var oldE = ui.editingExp && ui.admin ? data.expenses.find(function (x) { return x.id === ui.editingExp; }) : null;
      if (oldE) { Object.assign(oldE, e); logIt('edited', 'the expense ' + desc + ' (' + fmt(amount) + ')'); }
      else { data.expenses.push(stamp(Object.assign({ id: uid() }, e))); logIt('added', 'the expense ' + desc + ' (' + fmt(amount) + ')'); }
      ui.editingExp = null;
      save(); render();
    }
  });

  /* ---------- Drag and drop with pointer events, so it works with a finger too ---------- */
  app.addEventListener('pointerdown', function (e) {
    var g = e.target.closest('.grip');
    if (!g || (e.button && e.button !== 0)) return;
    var card = g.closest('.stop'), list = card && card.parentNode;
    if (!list) return;
    e.preventDefault();
    try { g.setPointerCapture(e.pointerId); } catch (x) {}
    list.classList.add('reordering');
    card.classList.add('dragging');
    drag = { card: card, list: list, moved: false };
  });
  app.addEventListener('pointermove', function (e) {
    if (!drag) return;
    e.preventDefault();
    var y = e.clientY, card = drag.card, stops = drag.list.querySelectorAll('.stop');
    for (var i = 0; i < stops.length; i++) {
      var s = stops[i];
      if (s === card) continue;
      var r = s.getBoundingClientRect(), mid = r.top + r.height / 2, cr = card.getBoundingClientRect();
      if (y < mid && cr.top > r.top) { drag.list.insertBefore(card, s); drag.moved = true; break; }
      if (y > mid && cr.top < r.top) { drag.list.insertBefore(card, s.nextSibling); drag.moved = true; break; }
    }
    Array.prototype.forEach.call(drag.list.querySelectorAll('.stop .num'), function (n, i) { n.textContent = i + 1; });
    if (y < 70) window.scrollBy(0, -14); else if (y > window.innerHeight - 70) window.scrollBy(0, 14);
  });
  function endDrag() {
    if (!drag) return;
    var d = drag;
    drag = null;
    if (d.moved) reorderCity(d.list.dataset.city, Array.prototype.map.call(d.list.querySelectorAll('.stop'), function (s) { return s.dataset.id; }));
    render();
  }
  app.addEventListener('pointerup', endDrag);
  app.addEventListener('pointercancel', endDrag);

  if (standalone() && location.protocol === 'https:' && FIREBASE_CONFIG.apiKey) startCloud();
  else save();
  render();
})();
