<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Wallet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pacifico&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: booking-site style. White app bar, city tabs as pills, a route sketch per city,
   then numbered stops with the drive between each pair. Light theme only, by choice. */
:root {
  --bg: #EEF2F8; --surface: #FFFFFF; --ink: #101B33; --muted: #59647A; --line: #DDE3EE;
  --primary: #1A5FD6; --primary-ink: #FFFFFF; --primary-soft: #E7EFFC; --primary-line: #8FB1EC;
  --sun: #FFD24C; --sun-soft: #FFF3CC; --sun-ink: #4D3900;
  --good: #137A47; --good-soft: #E2F5EA; --owe: #B23A20; --owe-soft: #FCE9E4;
  --map: #F4F8FD; --map-grid: #E2EAF6;
  --wxbg: #111827; --wxink: #FFFFFF; --wxsub: #C9D2E3;
  --display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body);
  padding-block: 0 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
#app { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance }
input, select, textarea, button { font: inherit; color: inherit }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-width: 0; max-width: 100% }
textarea { width: 100%; resize: vertical; font-size: 13px; word-break: break-all }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px }
button, .btn { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; color: var(--ink) }
button:disabled { opacity: .35; cursor: default }
.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary) }
.link { border: 0; background: none; padding: 4px 6px; color: var(--primary); font-size: 13px; font-weight: 600 }
.link.danger { color: var(--owe) }
.sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.grow { flex: 1 1 180px; min-width: 0 }
.err { color: var(--owe); font-size: 13px }
.note { background: var(--sun-soft); color: var(--sun-ink); border-radius: 10px; padding: 9px 12px; font-size: 13px }

.appbar { background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 18px 18px; padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center }
.brand { margin-right: auto; min-width: 0 }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--primary) }
.brand h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em }
.travelers { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px }
.av { font-size: 12px; font-weight: 600; background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 2px 9px }
.av.me { background: var(--primary); color: var(--primary-ink); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--primary) }
.hovertools { opacity: 0; transition: opacity .15s }
.stop:hover .hovertools, .stop:focus-within .hovertools, .list li:hover .hovertools, .list li:focus-within .hovertools { opacity: 1 }
@media (hover: none) { .hovertools { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .hovertools { transition: none } }
.hdr-actions { position: relative; flex: none }
html { overflow-x: hidden }
.hero { position: relative; z-index: 30; width: 100vw; margin-left: calc(50% - 50vw); color: #fff; overflow: visible; isolation: isolate; border-radius: 0 0 28px 28px }
.hero .beach { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: -1; border-radius: 0 0 28px 28px }
.hero-in { max-width: 820px; margin: 0 auto; min-height: 220px; padding-block: 22px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; justify-content: space-between; gap: 16px; box-sizing: border-box }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px }
.hero h1 { font-family: "Pacifico", "Brush Script MT", cursive; font-weight: 400; font-size: 50px; line-height: 1.15; letter-spacing: 0; color: #fff; text-shadow: 0 2px 12px rgba(5, 70, 105, .35) }
.hero-sub { font-size: 14px; font-weight: 600; color: #fff; text-shadow: 0 1px 6px rgba(5, 70, 105, .45) }
.hero .travelers { margin-top: 0 }
.hero .av { background: rgba(255, 255, 255, .85); color: #0A4F6E; backdrop-filter: blur(4px) }
.hero .av.me { background: #0A4F6E; color: #fff; box-shadow: 0 0 0 2px #fff }
.avatarbtn { position: relative; z-index: 2; width: 60px; height: 60px; border-radius: 50%; padding: 0; border: 3px solid #fff; overflow: hidden; background: #0A4F6E; box-shadow: 0 3px 12px rgba(5, 50, 80, .3); display: block }
.avatarbtn .face, .acct-head .face { width: 100%; height: 100%; object-fit: cover; display: flex; align-items: center; justify-content: center; font: 700 24px var(--display); font-style: normal; color: #fff; background: #0A4F6E; border-radius: 50% }
.acct-head .face { width: 44px; height: 44px; flex: none }
.acctmenu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 45; width: min(300px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 18px 40px rgba(16, 27, 51, .2); padding: 6px; display: flex; flex-direction: column }
.acct-head { display: flex; gap: 10px; align-items: center; padding: 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; min-width: 0 }
.acct-head .main { min-width: 0 }
.acct-head .sub { overflow-wrap: anywhere }
.acctmenu > button { border: 0; background: none; justify-content: flex-start; width: 100%; padding: 10px 12px; border-radius: 10px; font-weight: 500 }
.acctmenu > button:hover { background: var(--bg) }
.herobtn { background: rgba(255, 255, 255, .9); border-color: transparent; color: #0A4F6E }
@media (max-width: 520px) { .hero h1 { font-size: 40px } .hero-in { min-height: 200px } .avatarbtn { width: 52px; height: 52px } }
.logpop { position: absolute; top: calc(100% + 8px); right: 0; z-index: 40; width: min(440px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); text-shadow: none; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 18px 40px rgba(16, 27, 51, .18); padding: 14px; display: flex; flex-direction: column; gap: 10px }
.who { display: flex; flex-direction: column; gap: 6px }
.who-h { font-size: 13px; font-weight: 700; color: var(--ink) }
.who-list { display: flex; flex-wrap: wrap; gap: 6px }
.who-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--bg); color: var(--muted) }
.who-chip i { width: 8px; height: 8px; border-radius: 50%; background: #B7C0CF }
.who-chip.on { background: #E3F5EA; color: #17663A }
.who-chip.on i { background: #22A35A }
.leaflet-container { isolation: isolate; z-index: 0 }
.members summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--primary) }
.logscroll { max-height: min(45vh, 400px); overflow-y: auto; overscroll-behavior: contain; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px }
#activity-card h3 .count { font-size: 12px; font-weight: 600; background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 1px 8px; vertical-align: 2px }
.by { font-size: 12px; color: var(--muted) }
.wx { flex: none; display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 2px 6px; margin-right: 6px; color: var(--ink) }
.wx svg { flex: none; width: 24px; height: 24px }
.wxt { font: 700 17px var(--display); font-variant-numeric: tabular-nums }
.shotbtn { cursor: pointer }
.card.shotcard { border-color: var(--primary-line); background: var(--primary-soft) }
.shotcard input { background: var(--surface) }
.bdates { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13px; margin-top: 2px }
.bdates b { font-weight: 600; color: var(--muted); margin-right: 4px }
.conf b { font-variant-numeric: tabular-nums; letter-spacing: .02em }
.card.sw-only { padding: 24px; gap: 14px }
.booking { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 2px }
.bpill { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px }
.bpill.no { background: var(--owe-soft); color: var(--owe) }
.bpill.yes { background: var(--good-soft); color: var(--good) }
.link.small { font-size: 12px; padding: 2px 4px }
.link.muted { color: var(--muted) }
.linkbox { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; background: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 13px; min-width: 0 }
.linkbox a { font-weight: 600; color: var(--primary) }
.linkfull { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; min-width: 0; flex: 1 1 160px }
.linkform { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px }
.staychk { align-self: flex-start; font-size: 13px }
.bsum { align-self: flex-start; font-size: 13px; font-weight: 600; border-radius: 8px; padding: 6px 10px }
.bsum.no { background: var(--owe-soft); color: var(--owe) }
.bsum.yes { background: var(--good-soft); color: var(--good) }
.stop .title .bed { vertical-align: -3px; margin-right: 6px; color: var(--primary) }
.gate { padding: 24px; gap: 14px }
.warnnote { background: var(--owe-soft); color: var(--owe); font-weight: 500 }
.chipbtn.fits { background: var(--primary); color: var(--primary-ink) }
.gatehead { font-size: 22px; font-weight: 800; letter-spacing: -0.01em }
.big { padding: 12px 18px; font-size: 16px; gap: 10px }
.big svg { background: #fff; border-radius: 50%; padding: 2px; box-sizing: content-box }
.whoami { font-size: 13px; font-weight: 600; color: var(--muted) }
.av { display: inline-flex; align-items: center; gap: 5px }
.av.hasphoto { padding-left: 3px }
.av img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; flex: none }
.av .ini { width: 18px; height: 18px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; font: 700 10px var(--display); font-style: normal; background: var(--primary); color: var(--primary-ink) }
.av.me .ini { background: var(--surface); color: var(--primary) }
.pic { border-radius: 50%; object-fit: cover; flex: none; display: inline-flex; align-items: center; justify-content: center }
.pic.none { background: var(--primary-soft); color: var(--primary); font-weight: 700; font-family: var(--display) }
.pic.grp { background: var(--sun-soft); color: var(--sun-ink) }
.albums .albumrow { align-items: center; gap: 10px 12px }
.albumform { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 100% }
.adminpill { font-size: 12px; font-weight: 700; background: var(--sun); color: var(--sun-ink); border-radius: 999px; padding: 4px 10px }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px }
.tab { flex: none; border-radius: 999px; padding: 8px 14px }
.tab .count { font-size: 12px; font-weight: 600; background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums }
.tab[aria-selected="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink) }
.tab[aria-selected="true"] .count { background: var(--surface); color: var(--primary) }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px }
.cityhead h2 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em }
.between { justify-content: space-between }
.stayline { align-self: flex-start; background: var(--sun-soft); color: var(--sun-ink); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 500 }
.sketch > svg { width: 100%; height: auto; display: block; border-radius: 12px; background: var(--map); border: 1px solid var(--line) }
.sketch > svg .pin { cursor: pointer }
.farlist { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px }
.farchip { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--surface) }
.farchip b { color: var(--sun-ink); background: var(--sun); border-radius: 999px; padding: 0 6px; font-size: 11px }
.farchip.on { border-color: var(--primary); color: var(--primary) }
.mapslot { min-height: 300px }
.leafmap { height: 300px; border-radius: 12px; border: 1px solid var(--line); isolation: isolate; background: var(--map) }
.lpin { width: 28px; height: 28px; border-radius: 14px; background: var(--sun); color: var(--sun-ink); border: 2px solid #fff; font: 800 13px/24px var(--display); text-align: center; box-shadow: 0 1px 5px rgba(16, 27, 51, .35) }
.lpin.stay { background: var(--surface); color: var(--primary); border-color: var(--primary) }
.lpin.sel { background: var(--primary); color: var(--primary-ink); border-color: #fff; transform: scale(1.18) }
.nomap { background: var(--map); border: 1px dashed var(--line); border-radius: 12px; padding: 24px; text-align: center; color: var(--muted); font-size: 14px }
.gmap { width: 100%; height: 260px; border: 1px solid var(--line); border-radius: 12px; display: block }
.total { font-size: 14px; font-weight: 600 }

.stops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.stop { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0 }
.stop.sel { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft) }
.stop.dragging { border-color: var(--primary); box-shadow: 0 12px 28px rgba(16, 27, 51, .18); position: relative; z-index: 2 }
.stops.reordering { gap: 8px }
.stops.reordering .leg { display: none }
.grip { touch-action: none; cursor: grab; border: 0; background: none; padding: 6px 2px; color: var(--muted); flex: none }
.grip:active { cursor: grabbing }
.num { flex: none; width: 30px; height: 30px; border-radius: 15px; background: var(--sun); color: var(--sun-ink); font: 800 14px/30px var(--display); text-align: center; font-variant-numeric: tabular-nums }
.stop .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px }
.stop .title { border: 0; background: none; padding: 0; font-weight: 700; font-size: 16px; text-align: left; color: var(--ink); overflow-wrap: anywhere }
.when { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px }
.when input { padding: 5px 8px; font-size: 13px }
.loc { font-size: 13px; color: var(--owe) }
.loc.finding { color: var(--muted) }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none }
.chipbtn { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); border-color: transparent }
.updown { display: flex; gap: 4px }
.updown button { padding: 2px 8px; font-size: 13px }
.leg { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 4px 0 4px 54px; font-size: 13px; color: var(--muted); min-height: 40px }
.leg .line { width: 0; align-self: stretch; min-height: 32px; border-left: 2px dashed var(--primary-line); margin-left: -36px; margin-right: 22px }
.leg b { color: var(--ink); font-variant-numeric: tabular-nums }
.est { font-size: 11px; background: var(--bg); border-radius: 999px; padding: 1px 7px }
.warn { flex-basis: 100%; color: var(--sun-ink); background: var(--sun-soft); border-radius: 8px; padding: 4px 8px }
.locform { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px }

.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); flex: 1 1 150px; min-width: 0 }
.field input, .field select { font-size: 15px; color: var(--ink); width: 100% }
.card > .field { flex: none }
.search { position: relative }
.flabel { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px }
.searchbox { position: relative }
.searchbox svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none }
.searchbox input { width: 100%; padding: 12px 14px 12px 40px; font-size: 16px; border-radius: 999px }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; list-style: none; margin: 0; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 30px rgba(16, 27, 51, .16); max-height: 320px; overflow-y: auto }
.suggest button { width: 100%; border: 0; background: none; border-radius: 10px; padding: 9px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 0; text-align: left; font-weight: 400 }
.suggest button b { font-weight: 600 }
.suggest button span { font-size: 12px; color: var(--muted) }
.suggest li[aria-selected="true"] button, .suggest button:hover { background: var(--primary-soft) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--ink); background: var(--bg) }
.chip input { margin: 0; padding: 0 }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 18px; background: var(--surface) }
.stat { padding: 14px; min-width: 0 }
.stat + .stat { border-left: 1px solid var(--line) }
.stat .lbl { font-size: 12px; color: var(--muted) }
.stat .val { font: 700 22px var(--display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.list li { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line) }
.list li:first-child { border-top: 0 }
.list .main { flex: 1 1 180px; min-width: 0 }
.list .ttl { font-weight: 600; overflow-wrap: anywhere }
.amt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap }
.pill.pos { background: var(--good-soft); color: var(--good) } .pill.neg { background: var(--owe-soft); color: var(--owe) } .pill.zero { background: var(--bg); color: var(--muted) }
.empty { color: var(--muted); font-size: 14px; margin: 0 }
.version { max-width: 820px; margin: 28px auto 0; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
@media (max-width: 520px) {
  .stat .val { font-size: 17px } .stat { padding: 10px }
  .cityhead h2 { font-size: 22px }
  .stop { flex-wrap: wrap }
  .side { flex-direction: row; flex-wrap: wrap; align-items: center; width: 100%; padding-left: 74px }
  .stop .main { flex: 1 1 calc(100% - 90px) }
  .wx { margin-left: 74px }
}
.backup-actions { justify-content: flex-end; padding: 8px 0 18px; }
.completed-stops > summary { cursor: pointer; font-weight: 700; padding: 5px; }
.completed-stops .stop { opacity: .8; }
.stop { align-items: center; padding: 10px 12px; gap: 9px; }
.stop .main { gap: 3px; }
.stop .side { gap: 4px; }
.stop .hovertools { display: flex; gap: 6px; }
.stop .hovertools button { padding: 3px 5px; }
.stop .wx:empty, .stop .wx[hidden] { display: none !important; }
.stop-editor { list-style: none; margin: 6px 0 12px 40px; }
.stop-editor > .card { border-color: var(--primary-line); padding: 14px; gap: 10px; }
.stop-editor h3 { font-size: 18px; }
@media (max-width: 680px) {
  .stop { flex-wrap: nowrap; align-items: flex-start; }
  .stop .main { flex: 1 1 auto; }
  .stop .side { width: auto; padding-left: 0; flex: 0 0 auto; flex-direction: column; align-items: flex-end; }
  .stop .wx { margin-left: 0; }
  .stop-editor { margin-left: 0; }
}
.quick-add { display: flex; justify-content: flex-end; margin: 4px 0 12px; }
.wx-historical { font-size: 10px; font-weight: 600; white-space: nowrap; color: var(--muted); }
.wx { flex-wrap: wrap; max-width: 128px; }
.edit-overlay { position: fixed; inset: 0; background: rgba(10,24,48,.52); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 16px; }
.edit-sheet { width: min(440px, 100%); max-height: min(92dvh, 900px); overflow-y: auto; border-radius: 24px; background: var(--surface); box-shadow: 0 20px 65px rgba(0,0,0,.25); padding: 22px; }
.edit-stop-form { display: flex; flex-direction: column; gap: 17px; }
.edit-stop-form .field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
.edit-stop-form input, .edit-stop-form select, .edit-stop-form textarea { width: 100%; min-width: 0; font-size: 15px; }
.edit-top { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; text-align: center; }
.edit-top h3 { font-size: 20px; margin: 0; }
.edit-close, .edit-trash { border: 0; background: transparent; font-size: 23px; padding: 4px; }
.edit-trash { color: #dc2626; }
.edit-types { border: 0; padding: 0; margin: 0; min-width: 0; }
.edit-types legend { font-weight: 700; margin-bottom: 8px; }
.edit-type-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  function exportSpending() {
    if (!spending.length) { ui.msg = 'Add at least one purchase before exporting.'; render(); return; }
    var src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    function build() {
      var book = new window.ExcelJS.Workbook(), sheet = book.addWorksheet('Purchases');
      sheet.addRow(['Category', 'Amount', 'Currency', 'Paid By', 'Date', 'Time', 'Merchant', 'Fuel Quantity', 'Unit', 'Price Per Unit', 'Description']);
      spending.forEach(function (e) { sheet.addRow([e.category, e.amount / 100, e.currency, person(e.paidBy), e.date, e.time, e.merchant, e.quantity || '', e.unit || '', e.unitPrice || '', e.desc]); });
      var sum = book.addWorksheet('Summary'), groups = {};
      spending.forEach(function (e) { var key = e.currency + '|' + e.category + '|' + person(e.paidBy); groups[key] = (groups[key] || 0) + e.amount; });
      sum.addRow(['Currency', 'Category', 'Paid By', 'Total']);
      Object.keys(groups).sort().forEach(function (k) { var p = k.split('|'); sum.addRow([p[0], p[1], p[2], groups[k] / 100]); });
      return book.xlsx.writeBuffer().then(function (bytes) {
        var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = 'vacation-spending-' + today() + '.xlsx'; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      });
    }
    if (window.ExcelJS) { build().catch(function () { ui.msg = 'Excel export failed. Please try again.'; render(); }); return; }
    var sc = document.createElement('script'); sc.src = src; sc.onload = function () { build().catch(function () { ui.msg = 'Excel export failed.'; render(); }); };
    sc.onerror = function () { ui.msg = 'Excel library could not load. Connect to the internet and retry.'; render(); }; document.head.appendChild(sc);
  }
  function scanSpendingReceipt(file) {
    var status = document.getElementById('sp-ocr-status');
    if (!file || !status) return;
    if (file.size > 12 * 1024 * 1024) { status.textContent = 'Image too large (12 MB maximum).'; return; }
    status.textContent = 'Reading receipt locally…';
    loadOCR().then(function (T) { return T.recognize(file, 'eng'); }).then(function (r) {
      var t = r.data.text || '', lines = t.split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean);
      var total = t.match(/(?:grand\s*total|amount\s*paid|total)\s*[:$ ]*([0-9]+[.,][0-9]{2})/i);
      var date = t.match(/\b(20\d{2})[-\/]([01]?\d)[-\/]([0-3]?\d)\b/);
      var set = function (id, value) { var el = document.getElementById(id); if (el && value) el.value = value; };
      if (total) set('sp-amount', total[1].replace(',', '.'));
      if (date) set('sp-date', date[1] + '-' + date[2].padStart(2, '0') + '-' + date[3].padStart(2, '0'));
      if (lines[0]) set('sp-merchant', lines[0].slice(0, 100));
      var st = document.getElementById('sp-ocr-status');
      if (st) st.textContent = 'Receipt read. Check the amount, merchant, date, currency and payer before saving.';
    }).catch(function () { var st = document.getElementById('sp-ocr-status'); if (st) st.textContent = 'Could not read this receipt. Enter details manually.'; });
  }

  /* Text recognition (Tesseract.js) loads only when someone uploads a screenshot. */

  /* Picks the stop a booking most likely belongs to: a name match first, then the stay for multi-day bookings. */
  function guessTarget(cid, x) {
    /* City names and filler words say nothing about which stop it is. */
    var STOP = ['san', 'diego', 'los', 'angeles', 'las', 'vegas', 'arizona', 'the', 'and', 'for', 'with', 'tour', 'tours', 'ticket', 'tickets', 'booking', 'your', 'trip', 'day', 'night'];
    var list = cityPlaces(cid), words = function (t) { return (String(t || '').toLowerCase().match(/[a-z]{3,}/g) || []).filter(function (w) { return STOP.indexOf(w) < 0; }); };
    var nw = words(x.name), best = null, bestScore = 0;
    list.forEach(function (p) {
      var pw = words(p.name), hits = pw.filter(function (w) { return nw.indexOf(w) >= 0; }).length;
      var score = hits ? hits + (p.needsBooking && !p.booked ? 0.5 : 0) : 0;
      if (score > bestScore) { best = p; bestScore = score; }
    });
    if (best) return best.id;

    return 'new';

    if (sh.state !== 'done') {

    var x = sh.x, bits = [], list = cityPlaces(c.id), pick = guessTarget(c.id, x);
    if (x.checkIn) bits.push('<span><b>Starts</b> ' + niceDate(x.checkIn) + (x.inTime ? ', ' + fmtClock(x.inTime) : '') + '</span>');

    var fail = function (msg) { var slot = form.querySelector('[data-err]'); if (slot) { slot.textContent = msg; slot.hidden = false; } };

    if (form.id === 'admin-form') {
      var pin = val('admin-pin');
      if (!pin) return fail('Enter the PIN.');
      if (!window.crypto || !crypto.subtle) return fail('This browser cannot check the PIN here. Open the page over https.');
      sha(pin).then(function (h) {
        if (h !== ADMIN_HASH) return fail('That PIN is not right.');
        ui.admin = true; ui.adminOpen = false;
        try { sessionStorage.setItem(ADMIN_KEY, '1'); } catch (e) {}
        render();
      }, function () { fail('This browser cannot check the PIN here.'); });
      return;
    }

    if (form.id === 'shot-form' && ui.shot && ui.shot.x) {
      var x = ui.shot.x, which = val('shot-target') || 'new', nm = val('shot-name');
      var bk = { checkIn: x.checkIn, checkInTime: x.inTime, checkOut: x.checkOut, checkOutTime: x.outTime, confNo: x.conf, needsBooking: true, booked: true };
      if (x.checkIn) { bk.date = x.checkIn; bk.time = x.inTime || ''; }
      var tgt = which !== 'new' ? placeById(which) : null;
      if (tgt) {
        /* An existing stop keeps its name unless the name box was edited. */
        if (nm && nm !== (x.name || '') && nm.toLowerCase() !== tgt.name.toLowerCase()) {
          tgt.name = nm.slice(0, 80);
          if (tgt.kind === 'stay') tgt.hotel = true;
          if (!hasLL(tgt)) { tgt.q = ''; delete tgt.geo; delete geoTried[tgt.id]; }
        }
        Object.keys(bk).forEach(function (k) { if (bk[k] !== '' && bk[k] !== undefined) tgt[k] = bk[k]; });
        logIt('added a booking for', tgt.name + ' in ' + cityName(tgt.city));
      } else {
        if (!nm) return fail('Type a name for the new stop.');
        if (cityPlaces(ui.tab).some(function (q) { return q.name.toLowerCase() === nm.toLowerCase(); })) return fail(nm + ' is already a stop. Pick it under Put this booking on.');
        tgt = stamp(Object.assign({ id: 'u-' + uid(), city: ui.tab, name: nm.slice(0, 80), lat: null, lng: null, note: '', q: '', pin: false }, bk));
        data.places.push(tgt);
        logIt('added', tgt.name + ' in ' + cityName(ui.tab) + ' from a booking screenshot');
      }
      ui.sel = tgt.id; ui.shot = null;
      save(); render(); return;
    }

    if (form.classList.contains('albumform')) {
      var aid = form.dataset.id, araw = val('album-' + aid), alink = cleanLink(araw);
      if (!alink) return fail('Paste the album link, starting with https://');
      if (aid !== 'group') return;
      CLOUD.fs.setDoc(CLOUD.fs.doc(CLOUD.db, 'trips', 'main', 'albums', aid), { url: alink, by: me, at: new Date().toISOString() }).then(function () {
        logIt('set', 'the group photos link'); ui.albumEdit = null; save(); render();
      }, function (err) { fail('Could not save it (' + (err.code || err.message) + ').'); });
      return;
    }

    if (form.classList.contains('linkform')) {
      var lp = placeById(form.dataset.id), raw = val('blink-' + form.dataset.id), link = cleanLink(raw);
      if (raw && !link) return fail('That does not look like a web link. Paste the full address, starting with https://');
      if (lp) {
        var had = !!lp.bookingLink;
        lp.bookingLink = link;
        logIt(link ? (had ? 'changed the booking link for' : 'added a booking link for') : 'removed the booking link for', lp.name + ' in ' + cityName(lp.city));
        save();
      }
      ui.linkEdit = null; ui.linkOpen = link ? form.dataset.id : null;
      render(); return;
    }

    if (form.classList.contains('locform')) {
      var target = placeById(form.dataset.id), ll = Core.parseLatLng(val('loc-' + form.dataset.id));
      if (!ll) return fail('No location found in that. Use the full link from the address bar (short share links do not include it), or type latitude, longitude.');
      if (target) { target.lat = ll.lat; target.lng = ll.lng; target.pin = true; delete target.geo; save(); }
      ui.locFor = null; render(); return;
    }

    if (form.id === 'place-form') {
      var name = val('place-name'), link = ui.editing ? '' : val('place-link'), pll = link ? Core.parseLatLng(link) : null;
      if (!name) return fail('Type the name of the place.');
      if (link && !pll) return fail('That link has no location in it. Use the full link from the address bar (short share links do not include it), or type latitude, longitude.');
      var clash = cityPlaces(ui.tab).some(function (p) { return p.id !== ui.editing && p.name.toLowerCase() === name.toLowerCase(); });
      if (clash) return fail(name + ' is already on the list.');
      var rec = { name: name, note: val('place-note'), date: val('place-date'), time: val('place-time') };
      var old = ui.editing ? placeById(ui.editing) : null;
      if (old) {
        if (pll) { old.lat = pll.lat; old.lng = pll.lng; old.pin = true; delete old.geo; }
        else if (old.name !== name && !old.pin) { old.lat = null; old.lng = null; old.q = ''; delete old.geo; delete geoTried[old.id]; }
        Object.assign(old, rec);
        old.kind = (form.querySelector('input[name="place-type"]:checked') || {}).value || old.kind || 'other';
        if (old.kind === 'stay') { old.checkIn = rec.date; old.checkInTime = rec.time; old.checkOut = val('place-checkout'); old.checkOutTime = val('place-checkout-time'); }
        else { delete old.checkIn; delete old.checkInTime; delete old.checkOut; delete old.checkOutTime; }
        var bs = val('place-booking');
        old.needsBooking = bs !== 'none';
        old.booked = bs === 'booked';
         logIt('edited', old.name + ' in ' + cityName(old.city));
        ui.editing = null;
      } else {
        var sb = document.getElementById('place-stay'), sst = sb && sb.checked ? stayOf(ui.tab) : null;
        if (sst) {
          fillStay(sst, { name: name, lat: pll ? pll.lat : null, lng: pll ? pll.lng : null, q: '', pin: !!pll });
          if (!pll) { sst.lat = null; sst.lng = null; delete sst.geo; delete geoTried[sst.id]; }
          ui.sel = sst.id; ui.adding = false;
          save(); render(); return;
        }
        var np = Object.assign({ id: 'u-' + uid(), city: ui.tab, lat: pll ? pll.lat : null, lng: pll ? pll.lng : null, q: '', pin: !!pll }, rec);
        stamp(np);
        data.places.push(np);
        logIt('added', np.name + ' in ' + cityName(ui.tab));
        ui.sel = np.id;
        ui.adding = false;
      }
      save(); render(); return;
    }

    if (form.id === 'spending-form') {
      var amt=Core.toMinor(val('sp-amount')),payer=val('sp-payer'),category=val('sp-category'),date=val('sp-date');
      var split=Array.from(form.querySelectorAll('input[name="sp-split"]:checked')).map(function(c){return c.value;});
      if(!amt||amt<=0||!isPerson(payer))return fail('Enter an amount and choose who paid.');
      if(!date || !/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date))return fail('Choose a valid date.');
      if(!split.length)return fail('Select at least one traveler.');
      if(split.some(function(id){return !isPerson(id);})||new Set(split).size!==split.length)return fail('Invalid traveler selection.');
      if(CLOUD.on && CLOUD.state!=='ready')return fail('Shared expenses are not synced yet. Wait for sign-in and try again.');
      var item={id:uid(),amount:amt,paidBy:payer,category:category,currency:'USD',date:date,split:split,merchant:'',desc:'',time:'',quantity:'',unit:'',unitPrice:''};
      var existing=editingSharedExpense&&data.expenses.find(function(e){return e.id===editingSharedExpense;});
      if(existing){var originalId=existing.id;var oldInvolved=(existing.split||[]).concat([existing.paidBy]);Object.assign(existing,item,{id:originalId,by:existing.by,at:existing.at,updatedBy:me,updatedAt:new Date().toISOString()});logIt('edited','shared expense '+category+' '+Core.fmt(amt));var el=data.log[data.log.length-1];el.kind='expense';el.involved=Array.from(new Set(oldInvolved.concat(split,[payer])));}
      else{data.expenses.push(stamp(item));logIt('added','shared expense '+category+' '+Core.fmt(amt));var al=data.log[data.log.length-1];al.kind='expense';al.involved=Array.from(new Set(split.concat([payer])));}
      expenseFormOpen=false;editingSharedExpense=null;save();render();return;
    }
    if (form.id === 'expense-form') {
      var desc = val('exp-desc'), amount = Core.toMinor(val('exp-amount'));
      var split = Array.prototype.map.call(document.querySelectorAll('input[name="exp-split"]:checked'), function (c) { return c.value; });
      if (!desc) return fail('Say what the expense was.');
      if (amount === null || amount <= 0) return fail('Enter an amount above zero.');
      if (!split.length) return fail('Pick at least one person to split it between.');
      var e = { desc: desc, amount: amount, paidBy: val('exp-payer'), split: split, date: val('exp-date') || today() };
      var oldE = ui.editingExp ? data.expenses.find(function (x) { return x.id === ui.editingExp; }) : null;
      if (oldE) { Object.assign(oldE, e); logIt('edited', 'the expense ' + desc + ' (' + fmt(amount) + ')'); }
      else { data.expenses.push(stamp(Object.assign({ id: uid() }, e))); logIt('added', 'the expense ' + desc + ' (' + fmt(amount) + ')'); }
      ui.editingExp = null;
      save(); render();
    }
  });

  app.addEventListener('change', function(ev) {
    if(ev.target.id==='expense-view-person'){
      expenseViewPerson=ev.target.value;render();return;
    }
  });
  app.addEventListener('change', function(ev) {
    if (!ev.target.matches('#sp-all, input[name="sp-split"]')) return;
    var form = ev.target.closest('#spending-form');
    if (!form) return;
    var checks = Array.from(form.querySelectorAll('input[name="sp-split"]'));
    var all = form.querySelector('#sp-all');
    if (ev.target.id === 'sp-all') checks.forEach(function(c) { c.checked = all.checked; });
    else all.checked = checks.every(function(c) { return c.checked; });
  });
  /* ---------- Long press prevents accidental drag while scrolling ---------- */
  app.addEventListener('pointerdown', function (e) {
    var g = e.target.closest('.grip');
    if (!g || (e.button && e.button !== 0)) return;
    var card = g.closest('.stop'), list = card && card.parentNode;
    if (!list) return;
    var point = { x: e.clientX, y: e.clientY, pointerId: e.pointerId };
    drag = { card: card, list: list, moved: false, active: false, point: point, grip: g };
    drag.timer = setTimeout(function () {
      if (!drag || drag.card !== card) return;
      drag.active = true;
      try { g.setPointerCapture(point.pointerId); } catch (x) {}
      list.classList.add('reordering');
      card.classList.add('dragging');
    }, 420);
  });
  app.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.active) {
      if (Math.abs(e.clientY - drag.point.y) > 9 || Math.abs(e.clientX - drag.point.x) > 9) {
        clearTimeout(drag.timer); drag = null;
      }
      return;
    }
    e.preventDefault();
    var y = e.clientY, card = drag.card, stops = drag.list.querySelectorAll('.stop');
    for (var i = 0; i < stops.length; i++) {
      var s = stops[i];
      if (s === card) continue;
      var r = s.getBoundingClientRect(), mid = r.top + r.height / 2, cr = card.getBoundingClientRect();
      if (y < mid && cr.top > r.top) { drag.list.insertBefore(card, s); drag.moved = true; break; }
      if (y > mid && cr.top < r.top) { drag.list.insertBefore(card, s.nextSibling); drag.moved = true; break; }
    }
    Array.prototype.forEach.call(drag.list.querySelectorAll('.stop .num'), function (n, i) { n.textContent = i + 1; });
    if (y < 70) window.scrollBy(0, -14); else if (y > window.innerHeight - 70) window.scrollBy(0, 14);
  });
  function endDrag() {
    if (!drag) return;
    var d = drag;
    drag = null;
    clearTimeout(d.timer);
    d.list.classList.remove('reordering');
    d.card.classList.remove('dragging');
    if (!d.active) return;
    if (d.moved) reorderCity(d.list.dataset.city, Array.prototype.map.call(d.list.querySelectorAll('.stop'), function (s) { return s.dataset.id; }));
    render();
  }
  app.addEventListener('pointerup', endDrag);
  app.addEventListener('pointercancel', endDrag);

  if (standalone() && location.protocol === 'https:' && FIREBASE_CONFIG.apiKey) startCloud();
  else save();
  render();
})();
</script>
</body>
</html>
